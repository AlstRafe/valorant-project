{# The pages under the owner's ライブ tab: the game being played now, what is left to play for, and (the PC app)
   the owner's friends. #}
{% set here = request.endpoint %}<nav class="modes" aria-label="{{ t('ページ') }}"><a href="{{ url_for('live') }}"{% if here == 'live' %} aria-current="true"{% endif %}>{{ t('ライブ') }}</a><a href="{{ url_for('progress') }}"{% if here == 'progress' %} aria-current="true"{% endif %}>{{ t('進行状況') }}</a>{% if desktop %}<a href="{{ url_for('friends') }}"{% if here == 'friends' %} aria-current="true"{% endif %}>{{ t('フレンド') }}</a>{% endif %}</nav>
