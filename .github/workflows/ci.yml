# Tests and style checks on every push. The VM serves whatever reaches master
# within a minute, so a red mark here is the warning before (or right after) it goes live.
name: CI

# Every branch on push (a pull request shows the run of its branch's last commit), or by hand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows runners print with cp1252; the pages and messages are Japanese.
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 with Python 3.12 is what the VM runs; Windows is the PC.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  lint:
    name: Style (Ruff, Prettier, ESLint, Taplo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # nothing to install but Ruff and Taplo
      - run: uvx ruff@0.16.9 check .
      - run: uvx ruff@0.16.9 format --check .
      - run: uvx taplo@0.9.3 fmt --check
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  layout:
    name: Layout (every page, 360-1440 px)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium and the fonts it needs (Japanese, Korean and Chinese among them), so text is as wide as on a PC.
      - run: npx playwright install --with-deps chromium
      - name: Look for broken layout (the tests' made-up answers)
        run: |
          python tests/ui/serve.py 5077 > serve.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:5077/ && break; sleep 1; done
          node tests/ui/audit.js http://127.0.0.1:5077 --quick

  # By hand only (Actions -> CI -> Run workflow): the live site, with real players, matches and pictures. The VM is
  # small, so this is slow; it tells what it finds as it goes, and never fails the run (the live site may lag master).
  live-layout:
    name: Layout of the live site
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Dispatched right after a merge: the VM takes master within a minute, then the server restarts
      # (about a minute), so the pages are checked once the new code answers.
      - name: Give the VM time to take the push
        run: sleep 150
      - run: node tests/ui/audit.js https://haruxera.duckdns.org/val --live
