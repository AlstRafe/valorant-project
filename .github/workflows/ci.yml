# push のたびにテストとスタイルの確認。master に届いたものは 1 分以内に VM が配るので、ここの赤い印は公開前（か直後）
# の警告。
name: CI

# push ではどのブランチも（プルリクエストにはそのブランチの最後のコミットの実行が出る）、または手動で。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows のランナーは cp1252 で出力する。ページとメッセージは日本語。
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # VM が動かしているのは Ubuntu 24.04 と Python 3.12。Windows は PC。
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  lint:
    name: Style (Ruff, Prettier, ESLint, Taplo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # nothing to install but Ruff and Taplo
      - run: uvx ruff@0.16.9 check .
      - run: uvx ruff@0.16.9 format --check .
      - run: uvx taplo@0.9.3 fmt --check
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  layout:
    name: Layout (every page, 360-1440 px)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium と必要なフォント（日本語・韓国語・中国語も）。文字の幅が PC と同じになる。
      - run: npx playwright install --with-deps chromium
      - name: Look for broken layout (the tests' made-up answers)
        run: |
          python tests/ui/serve.py 5077 > serve.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:5077/ && break; sleep 1; done
          node tests/ui/audit.js http://127.0.0.1:5077 --quick
      - name: Look for broken layout (the PC app's own pages)
        run: |
          python tests/ui/serve.py 5078 --desktop > desktop.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:5078/ && break; sleep 1; done
          node tests/ui/audit.js http://127.0.0.1:5078 --quick --desktop

  # 手動だけ（Actions -> CI -> Run workflow）: 本番のサイトを本物のプレイヤー・試合・絵で。VM は小さいので遅い。
  # 見つけたものを順に伝え、実行を失敗にはしない（本番は master より遅れることがある）。
  live-layout:
    name: Layout of the live site
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # マージ直後に起動: VM は 1 分以内に master を取り、サーバーが再起動する（1 分ほど）ので、
      # 新しいコードが答えてからページを確かめる。
      - name: Give the VM time to take the push
        run: sleep 150
      - run: node tests/ui/audit.js https://haruxera.duckdns.org/val --live
