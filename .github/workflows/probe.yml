# Temporary: riotweb.py's esports schedule against Riot's real page (removed before merging).
name: Probe
on:
  push:
    branches: [claude/project-thread-mqrnd2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - name: riotweb.py with Riot's real page
        shell: python
        run: |
          import collections, sys, time
          sys.path.insert(0, ".")
          from valtracker.riotweb import RiotWeb
          from valtracker.media import outside_path
          web = RiotWeb()
          for lang in ("ja", "ko", "en-GB", "zh-TW"):
              start = time.monotonic()
              try:
                  games = web.esports(lang)
              except Exception as error:
                  print(lang, "FAILED", repr(error), getattr(error, "detail", "")); continue
              print(f"\n{lang}: {len(games)} games in {time.monotonic() - start:.2f} s | asked:", sorted(k[1] for k in web.cache._items if isinstance(k, tuple) and k[0] == "esports") if hasattr(web.cache, "_items") else "")
              print("   states", dict(collections.Counter(g["state"] for g in games)), "| leagues", dict(collections.Counter(g["league"]["name"] for g in games)))
              print("   pictures not ours", sum(1 for g in games for t in g["teams"] if t["icon"] and not outside_path(t["icon"])), "| league icons not ours", sum(1 for g in games if g["league"]["icon"] and not outside_path(g["league"]["icon"])))
              for g in games[:2] + games[-1:]:
                  print("   ", g["at"], g["league"], g["tournament"], "Bo", g["best_of"], [(t["name"], t["code"], t["icon"]) for t in g["teams"]])
