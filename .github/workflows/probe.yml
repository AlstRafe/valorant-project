# Temporary: what Riot's site and the live site say about the latest patch notes (removed before merging).
name: Probe
on:
  push:
    branches: [claude/project-thread-mqrnd2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Riot's own sources
        shell: python
        run: |
          import json, re, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (probe)"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.headers.get("content-type"), r.read()
              except Exception as e:
                  return getattr(e, "code", 0), str(e), (e.read() if hasattr(e, "read") else b"")
          def show(name, url, depth=1400):
              s, ct, b = get(url)
              print("\n==", name, url, s, ct, len(b))
              try:
                  data = json.loads(b)
              except Exception:
                  print("  not json:", b[:200]); return None
              print("  ", json.dumps(data, ensure_ascii=False)[:depth])
              return data
          base = "https://content.publishing.riotgames.com/publishing-content/v2.0/public/channel/valorant_website/list/valorant_news_page_list"
          show("news list", base + "?locale=ja_JP&from=0&limit=2", depth=3000)
          show("patch tag", base + "?locale=ja_JP&from=0&limit=1&tags=patch_notes", depth=600)
          for region in ("ap", "kr"):
              show("status " + region, f"https://valorant.secure.dyn.riotcdn.net/channels/public/x/status/{region}.json", depth=2500)
          for url in ("https://valorantesports.com/ja-JP/schedule", "https://valorantesports.com/schedule"):
              s, ct, b = get(url)
              print("\n== esports page", url, s, ct, len(b))
              t = b.decode("utf-8", "replace")
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', t, re.S)
              print("  next data:", bool(m), "| startTime count:", len(re.findall(r'startTime', t)), "| scripts:", len(re.findall(r"<script", t)))
              print("  ", (m.group(1) if m else t)[:1200].replace("\n", " "))
