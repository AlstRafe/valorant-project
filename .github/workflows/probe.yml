# Temporary: what Riot's site and the live site say about the latest patch notes (removed before merging).
name: Probe
on:
  push:
    branches: [claude/project-thread-mqrnd2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Riot's patch-notes pages and the live news page
        shell: python
        run: |
          import json, re, urllib.request
          def get(url, cookie=""):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (probe)", "Cookie": cookie, "Accept-Language": "ja"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.geturl(), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, url, e.read()
              except Exception as e:
                  return 0, url, str(e).encode()
          for lang, cookie in (("ja", "lang=ja"), ("zh-TW", "lang=zh-TW")):
              s, u, b = get("https://haruxera.duckdns.org/val/news", cookie)
              t = b.decode("utf-8", "replace")
              m = re.search(r'<p class="patch-now">.*?</p>', t, re.S)
              print("LIVE", lang, s, m.group(0)[:400] if m else "no patch-now")
              print("  first titles:", re.findall(r'<h3[^>]*>(.*?)</h3>', t, re.S)[:5])
          def walk(node, path, out):
              if isinstance(node, dict):
                  if "title" in node and any(k in node for k in ("publishedAt", "date", "published_at", "datetime")):
                      out.append((path, node))
                  for k, v in node.items():
                      walk(v, path + "." + k, out)
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, path + f"[{i}]", out)
          for url in ("https://playvalorant.com/ja-jp/news/tags/patch-notes/", "https://playvalorant.com/en-gb/news/tags/patch-notes/", "https://playvalorant.com/ja-jp/news/", "https://playvalorant.com/page-data/ja-jp/news/tags/patch-notes/page-data.json"):
              s, u, b = get(url)
              t = b.decode("utf-8", "replace")
              print("\nRIOT", url, s, u, len(b))
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', t, re.S)
              data = None
              if m:
                  data = json.loads(m.group(1))
              elif url.endswith(".json") and s == 200:
                  data = json.loads(t)
              if data is None:
                  print("  no data; head:", t[:300].replace("\n", " "))
                  continue
              out = []
              walk(data, "$", out)
              print("  items:", len(out))
              for path, node in out[:8]:
                  slim = {k: (v if not isinstance(v, (dict, list)) else type(v).__name__) for k, v in node.items()}
                  print("  ", path, json.dumps(slim, ensure_ascii=False)[:600])
              if out:
                  print("  FIRST FULL:", json.dumps(out[0][1], ensure_ascii=False)[:1500])
