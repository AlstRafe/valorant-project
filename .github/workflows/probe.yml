# Temporary: what Riot's esports site carries in its schedule page (removed before merging).
name: Probe
on:
  push:
    branches: [claude/project-thread-mqrnd2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The schedule in valorantesports.com's page
        shell: python
        run: |
          import json, re, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (probe)"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.headers.get("content-type"), r.read()
              except Exception as e:
                  return getattr(e, "code", 0), str(e), (e.read() if hasattr(e, "read") else b"")
          s, ct, b = get("https://haruxera.duckdns.org/val/esports")
          print("LIVE /esports", s, len(b))
          for url in ("https://valorantesports.com/ja-JP/schedule",):
              s, ct, b = get(url)
              t = b.decode("utf-8", "replace")
              spots = [m.start() for m in re.finditer("startTime", t)]
              print("\n==", url, s, len(t), "| startTime in raw", len(spots))
              print("  script kinds:", sorted(set(re.findall(r"<script([^>]*)>", t)))[:20])
              print("  push heads:", sorted(set(m.group(0)[:30] for m in re.finditer(r"self\.__next_f\.push\(\[\d+", t))))
              for n in (1, 2, 5, 40):
                  if n < len(spots):
                      i = spots[n]
                      print(f"  RAW #{n} at {i}:", t[i - 1200: i + 1800])
