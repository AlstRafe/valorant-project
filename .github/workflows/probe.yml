# Temporary: riotweb.py against Riot's real answers (removed before merging).
name: Probe
on:
  push:
    branches: [claude/project-thread-mqrnd2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - name: riotweb.py with Riot's real answers
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from valtracker.riotweb import RiotWeb
          from valtracker.media import outside_path
          web = RiotWeb()
          for country in ("ja-jp", "ko-kr", "en-gb", "zh-tw"):
              news = web.news(country)
              patch = next((item for item in news if item["category"] == "patch_notes"), None)
              cats = sorted({item["category"] for item in news})
              print(country, len(news), "patch:", patch and (patch["title"], patch["at"], patch["url"]))
              print("   categories", cats, "| no url", sum(not item["url"] for item in news), "| banner not ours", sum(bool(item["banner"]) and not outside_path(item["banner"]) for item in news), "| no banner", sum(not item["banner"] for item in news))
              for item in news[:3]:
                  print("   ", item["at"], item["title"], item["url"], outside_path(item["banner"]))
          for region in ("ap", "kr", "eu", "na", "latam", "br"):
              print(region, web.status(region))
