name: probe
on:
  push:
    branches: [claude/project-thread-mqrnd2]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Maps
        run: |
          curl -sS -m 30 "https://valorant-api.com/v1/maps?language=ja-JP" -o maps.json
          python3 - <<'PY'
          import json
          data = json.load(open("maps.json"))["data"]
          print("keys", sorted(data[0]))
          for item in data:
              callouts = item.get("callouts") or []
              print(item["displayName"], item.get("mapUrl"), item.get("xMultiplier"), item.get("yMultiplier"),
                    item.get("xScalarToAdd"), item.get("yScalarToAdd"), item.get("displayIcon"), len(callouts),
                    json.dumps(callouts[:2], ensure_ascii=False))
          PY
