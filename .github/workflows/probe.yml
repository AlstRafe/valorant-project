# Temporary: what Riot's site and the live site say about the latest patch notes (removed before merging).
name: Probe
on:
  push:
    branches: [claude/project-thread-mqrnd2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Shapes of Riot's news pages
        shell: python
        run: |
          import collections, json, re, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (probe)"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.headers.get("content-type"), r.read()
              except Exception as e:
                  return getattr(e, "code", 0), "", b""
          for country in ("ja-jp", "ko-kr", "zh-tw", "en-gb"):
              for tail in ("news/", "news/tags/patch-notes/"):
                  url = f"https://playvalorant.com/{country}/{tail}"
                  s, ct, b = get(url)
                  m = re.search(rb'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', b, re.S)
                  print("\n==", url, s, ct, len(b), "next" if m else "NO NEXT")
                  if not m:
                      continue
                  data = json.loads(m.group(1))
                  blades = data["props"]["pageProps"]["page"].get("blades") or []
                  print("  blades:", [(bl.get("type"), len(bl.get("items") or [])) for bl in blades])
                  for bl in blades:
                      items = bl.get("items") or []
                      if not items or "publishedAt" not in items[0]:
                          continue
                      kinds = collections.Counter((i.get("action") or {}).get("type") for i in items)
                      cats = collections.Counter((i.get("category") or {}).get("machineName") for i in items)
                      tags = collections.Counter(t.get("machineName") for i in items for t in i.get("tags") or [])
                      print("  ", bl.get("type"), "actions", dict(kinds), "cats", dict(cats), "tags", dict(tags))
                      done = set()
                      for i in items:
                          k = (i.get("action") or {}).get("type")
                          if k not in done:
                              done.add(k)
                              print("   action", json.dumps(i.get("action"), ensure_ascii=False)[:300])
                      for i in items[:3]:
                          print("   ", i.get("publishedAt"), i.get("title"), json.dumps(i.get("tags"), ensure_ascii=False)[:300])
                      print("   keys of blade:", [k for k in bl if k != "items"], json.dumps({k: v for k, v in bl.items() if k != "items"}, ensure_ascii=False)[:400])
