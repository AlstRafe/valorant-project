# The PC app (VALTracker.exe, valtracker/desktop.py): built on Windows at every push that touches it, then checked
# (the built app answers its pages; its window is opened and how much memory and processor the app takes, and at
# which priority, is printed). The run keeps the zip as its download; on master it also goes on the release
# "desktop" (Releases -> desktop -> VALTracker-windows.zip), replaced each time.
name: Desktop app

on:
  push:
    paths:
      - "valtracker/**"
      - "desktop/**"
      - "requirements*.txt"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VALTracker.exe
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write # the release, on master only
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the stamp reads the history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pillow: PyInstaller turns the site's icon (PNG) into the .exe's
      - run: python -m pip install -r requirements.txt -r requirements-desktop.txt pyinstaller==6.22.3 pillow==12.2.0
      # which commit the app is built from and when it was made, shown in the app's 設定 and compared with what the
      # site says is the newest (valtracker/release.py: the last commit that changed the app's files)
      - name: Stamp the build
        run: python -m valtracker.release valtracker/BUILD
      - name: Build
        run: >-
          pyinstaller --noconfirm --clean --windowed --name VALTracker --paths .
          --icon valtracker/static/apple-touch-icon.png
          --add-data "valtracker/templates;valtracker/templates"
          --add-data "valtracker/static;valtracker/static"
          --add-data "valtracker/BUILD;valtracker"
          --collect-submodules valtracker
          desktop/VALTracker.py
      - name: The built app answers its pages (no window)
        shell: pwsh
        run: |
          $env:VAL_DESKTOP_HOME = "$env:RUNNER_TEMP\vt-check"
          $app = Start-Process dist\VALTracker\VALTracker.exe -ArgumentList "--check" -PassThru
          $done = $app.WaitForExit(180000)
          if (-not $done) { Stop-Process -Id $app.Id -Force; "Still running after 3 minutes." }
          Get-ChildItem "$env:VAL_DESKTOP_HOME\*.log" | ForEach-Object { "--- $($_.Name)"; Get-Content $_ }
          if (-not $done -or $app.ExitCode -ne 0) { exit 1 }
      # the way the app reaches a PC: a browser downloads the zip and marks it as come from the internet, Explorer
      # passes the mark on to every file it unpacks, and .NET refuses to load a marked library (the window's part).
      # The .exe is left unmarked: its mark is gone once the owner has answered Windows' "run anyway?", a question
      # that would wait for ever here.
      - name: Unpacked from a downloaded zip (every file marked by Windows), the app still opens its own window
        shell: pwsh
        run: |
          $runtime = "SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          if (-not (Test-Path "HKLM:\$runtime")) { "This runner has no WebView2 Runtime: nothing to try."; exit 0 }
          $env:VAL_DESKTOP_HOME = "$env:RUNNER_TEMP\vt-marked"
          $marked = "$env:RUNNER_TEMP\marked\VALTracker"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\marked" | Out-Null
          Copy-Item dist\VALTracker $marked -Recurse
          $files = Get-ChildItem $marked -Recurse -File | Where-Object Name -ne "VALTracker.exe"
          $files | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]", "ZoneId=3" }
          "Marked $($files.Count) files as come from the internet."
          $app = Start-Process "$marked\VALTracker.exe" -ArgumentList "--close-after", "30" -PassThru
          Start-Sleep -Seconds 20
          $window = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "msedgewebview2.exe" -and $_.ParentProcessId -eq $app.Id }
          $browsers = Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue
          if (-not $app.WaitForExit(40000)) { Stop-Process -Id $app.Id -Force; "The app was ended by hand (a message box was waiting)." }
          $browsers | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Content "$env:VAL_DESKTOP_HOME\desktop.log"
          if (-not $window) { "NO WINDOW: the app did not open its own window."; exit 1 }
          if ($browsers) { "A BROWSER WAS OPENED: $(($browsers | ForEach-Object ProcessName | Select-Object -Unique) -join ', ')"; exit 1 }
          $left = @(Get-ChildItem $marked -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }).Count
          if ($left) { "STILL MARKED: $left files"; exit 1 }
          "The app took the mark off its files and opened its own window, and no browser."
      - name: The window, and what the app takes (memory, processor, priority)
        shell: pwsh
        continue-on-error: true # a runner without WebView2 or a desktop says so, and the build still counts
        run: |
          $env:VAL_DESKTOP_HOME = "$env:RUNNER_TEMP\vt-window"
          $app = Start-Process dist\VALTracker\VALTracker.exe -ArgumentList "--close-after", "140" -PassThru
          function Tree($root) {
            $all = Get-CimInstance Win32_Process
            $ids = @($root)
            do {
              $more = @($all | Where-Object {
                $_.ProcessId -ne 0 -and $ids -contains $_.ParentProcessId -and $ids -notcontains $_.ProcessId
              })
              $ids += @($more | ForEach-Object ProcessId)
            } while ($more.Count -gt 0)
            Get-Process -Id $ids -ErrorAction SilentlyContinue
          }
          function Busy($processes) { ($processes | Measure-Object -Property CPU -Sum).Sum }
          Start-Sleep -Seconds 40 # started, the page drawn, the pictures fetched
          $before = Tree $app.Id
          $cpu = Busy $before
          Start-Sleep -Seconds 40 # left alone, as during a match
          $after = Tree $app.Id
          $used = (Busy $after) - $cpu
          $after | Sort-Object Id | Format-Table Id, ProcessName, PriorityClass,
            @{ n = "Memory (MB)"; e = { [math]::Round($_.WorkingSet64 / 1MB) } },
            @{ n = "Private (MB)"; e = { [math]::Round($_.PrivateMemorySize64 / 1MB) } }, CPU -AutoSize
          $memory = [math]::Round(($after | Measure-Object WorkingSet64 -Sum).Sum / 1MB)
          $private = [math]::Round(($after | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB)
          $share = [math]::Round(100 * $used / 40, 2)
          "Processes: $($after.Count), memory $memory MB counted per process, $private MB its own (private)"
          "Processor while idle: $([math]::Round($used, 2)) s in 40 s = $share % of one core"
          if (-not ($after | Where-Object ProcessName -eq "msedgewebview2")) { "No WebView2 window opened here." }
          # opened a second time: it finds the first one's window, brings it back and ends (a message box that
          # nobody closes would keep it running)
          $second = Start-Process dist\VALTracker\VALTracker.exe -PassThru
          if ($second.WaitForExit(20000)) { "Opened twice: the second start found the window and ended." }
          else { Stop-Process -Id $second.Id -Force; "Opened twice: THE WINDOW WAS NOT FOUND (the second start waits in its message box)." }
          Get-Content "$env:VAL_DESKTOP_HOME\desktop.log"
          if (-not $app.WaitForExit(60000)) { Stop-Process -Id $app.Id -Force }
      # the update's last step, on a real Windows: the new build takes the place of a running, older one once that
      # has closed, leaves the owner's other files alone, and opens the app again (here: only to check its pages)
      - name: The app replaces itself (update.py)
        shell: pwsh
        run: |
          $env:VAL_DESKTOP_HOME = "$env:RUNNER_TEMP\vt-update"
          $env:VAL_UPDATE_THEN = "--check"
          $old = "$env:RUNNER_TEMP\installed\VALTracker"
          $new = "$env:RUNNER_TEMP\staged\VALTracker"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\installed", "$env:RUNNER_TEMP\staged" | Out-Null
          Copy-Item dist\VALTracker $old -Recurse
          Copy-Item dist\VALTracker $new -Recurse
          Set-Content "$old\_internal\valtracker\BUILD" "0000000000000000000000000000000000000000 1" -NoNewline -Encoding ascii
          Set-Content "$old\mine.txt" "the owner's own file"
          $app = Start-Process "$old\VALTracker.exe" -ArgumentList "--close-after", "25" -PassThru
          Start-Sleep -Seconds 10
          $swap = Start-Process "$new\VALTracker.exe" -ArgumentList "--install-over", "`"$old`"", "--wait-pid", $app.Id -PassThru
          # the old app closes by itself (its window, after 25 s); one that cannot open a window here is ended
          if (-not $app.WaitForExit(40000)) { Stop-Process -Id $app.Id -Force; "The old app was ended by hand." }
          if (-not $swap.WaitForExit(150000)) { Stop-Process -Id $swap.Id -Force; "The new build did not finish."; exit 1 }
          # the app opened after it checks its pages and ends
          $left = 90
          while ($left -gt 0 -and (Get-Process VALTracker -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds 3; $left -= 3 }
          Get-Process VALTracker -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-ChildItem "$env:VAL_DESKTOP_HOME\*.log" | ForEach-Object { "--- $($_.Name)"; Get-Content $_ }
          $stamp = Get-Content "$old\_internal\valtracker\BUILD" -Raw
          $wanted = Get-Content valtracker\BUILD -Raw
          if ($stamp -ne $wanted) { "NOT REPLACED: the app's folder still holds $stamp"; exit 1 }
          if (-not (Test-Path "$old\mine.txt")) { "A FILE OF THE OWNER'S WAS REMOVED"; exit 1 }
          if ((Test-Path "$old\_internal.old") -or (Test-Path "$old\VALTracker.exe.old")) { "THE OLD BUILD WAS LEFT BEHIND"; exit 1 }
          if (-not (Select-String -Path "$env:VAL_DESKTOP_HOME\update.log" -Pattern "replaced" -Quiet)) { "NO WORD OF IT IN update.log"; exit 1 }
          if (-not (Select-String -Path "$env:VAL_DESKTOP_HOME\desktop.log" -Pattern "ok  200 /settings" -Quiet)) { "THE UPDATED APP DID NOT ANSWER ITS PAGES"; exit 1 }
          "Replaced, the owner's file kept, the updated app answers its pages."
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\VALTracker -DestinationPath VALTracker-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: VALTracker-windows
          path: VALTracker-windows.zip
          retention-days: 30
      - name: Put it on the release "desktop" (master)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop --yes --cleanup-tag || true
          gh release create desktop VALTracker-windows.zip --target "$GITHUB_SHA" --prerelease \
            --title "VAL Tracker（PC アプリ）" \
            --notes "Windows 10 / 11。VALTracker-windows.zip を展開して VALTracker.exe を開く。使い方と VALORANT への影響を抑える仕組みは README の「PC アプリ」。"
      # the app asks the site which build is the newest: what the site answers now (it follows master every minute)
      - name: What the site says the newest build is
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          echo "This build: $(cat valtracker/BUILD)"
          echo "The site:   $(curl -sS --max-time 20 https://haruxera.duckdns.org/val/app/latest)"
