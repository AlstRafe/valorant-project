# Python style for Home Page and News Site (the same file in both repositories).
# Format: ruff format .   Check: ruff check .   (uvx ruff ... without installing; VS Code: the Ruff extension)
line-length = 120
target-version = "py311"

[format]
line-ending = "lf"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "B905", # zip() without strict=: the shorter list ending the pairs is what is meant
  "E402", # imports after sys.path is set up, or at the end of a module to break an import cycle
  "E731", # a short lambda kept as a name
  "E741", # l for a line
  "UP031", # % formatting where { } would need escaping
]
